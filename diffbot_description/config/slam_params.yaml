slam_toolbox:
  ros__parameters:
    use_sim_time: true
    slam_mode: true               # run online SLAM
    map_file_name: ""             # no prior map
    publish_period_sec: 1.0
    resolution: 0.05
    scan_topic: /scan
    odom_topic: /odom
    transform_publish_period: 0.1
    map_publish_period: 0.5

